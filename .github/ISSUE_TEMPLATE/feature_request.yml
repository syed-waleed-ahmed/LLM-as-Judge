name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project runs on free tiers and local models only, so features must not
        require a paid service. See the [roadmap](https://github.com/syed-waleed-ahmed/LLM-as-Judge/blob/main/ROADMAP.md)
        for what's already planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the evaluation task or workflow you're trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Example commands or code help a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
