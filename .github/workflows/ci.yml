name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest --cov=llm_judge --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --skip-editable

  # Python 3.10 is end of life (October 2026) and deprecated here. The library,
  # CLI and REST API still support it, so their dependencies are audited on it.
  # The dashboard extra isn't: Pillow's security fixes need Python 3.11 or later.
  # pip-audit runs from its own environment so its tooling isn't audited too.
  audit-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install the project (library, CLI, API) in its own environment
        run: |
          python -m venv /tmp/project
          /tmp/project/bin/python -m pip install --upgrade pip setuptools
          /tmp/project/bin/python -m pip install -e ".[api,yaml]"

      - name: Audit it for known vulnerabilities
        run: |
          python -m pip install pip-audit
          PIPAPI_PYTHON_LOCATION=/tmp/project/bin/python pip-audit --skip-editable

  # The experiment store against a real PostgreSQL server (what Supabase runs).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project with the PostgreSQL extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Run the store tests on SQLite and PostgreSQL
        env:
          JUDGE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pytest tests/test_store_backends.py -rs -p no:cacheprovider
          # Fail if the PostgreSQL variants were skipped instead of run.
          test "$(pytest tests/test_store_backends.py -q -p no:cacheprovider -rs | grep -c SKIPPED)" = 0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: pip install "bandit[toml]>=1.7"

      - name: Static security analysis (Bandit)
        run: bandit -c pyproject.toml -r src app.py dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t llm-judge:ci .

      - name: Smoke-test the REST API container
        run: |
          docker run -d --name api -p 8000:8000 -e JUDGE_PROVIDER=mock llm-judge:ci \
            llm-judge serve --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/evaluate/pairwise \
            -H "Content-Type: application/json" \
            -d '{"task_description": "Explain DNS", "output_a": "DNS maps domain names to IP addresses.", "output_b": "It is DNS."}' \
            | grep -q overall_winner

      - name: Smoke-test the dashboard container
        run: |
          docker run -d --name ui -p 8501:8501 -e JUDGE_PROVIDER=mock llm-judge:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8501/_stcore/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok

      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true; docker logs ui || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"

      - name: Build the documentation site (strict)
        run: mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/llm-judge --version
          JUDGE_PROVIDER=mock /tmp/wheel-env/bin/llm-judge benchmark safety

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
