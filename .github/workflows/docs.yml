name: Docs

# Publishes the MkDocs site to GitHub Pages. One-time setup: repository
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A PostgreSQL server, so the coverage figure includes the PostgreSQL store.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
          mkdocs build --strict

      # The README's coverage badge reads this file through shields.io, so it
      # always shows the real coverage of the latest main.
      - name: Measure test coverage for the README badge
        env:
          JUDGE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pip install -e ".[ui,dev,postgres]"
          pytest -q -p no:cacheprovider --cov=llm_judge --cov-report=json:coverage.json
          python scripts/coverage_badge.py coverage.json site/badges/coverage.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
