name: Release

# Push a tag like v2.0.0 to build and create a GitHub Release (with the wheel and
# sdist attached). Publishing to PyPI is opt-in: add a "trusted publisher" for this
# repository on PyPI (workflow "release.yml", environment "pypi"; no API token is
# stored anywhere), then set the repository variable PUBLISH_TO_PYPI to "true".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/llm_judge/__init__.py').read_text()).group(1))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version v$VERSION"; exit 1; }

      - name: Check that CHANGELOG.md has notes for this version
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null

      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The release notes are this version's section of CHANGELOG.md.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python3 scripts/release_notes.py "$GITHUB_REF_NAME"
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LLM-as-Judge ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
