# Local checks that run on every commit. Set up once with:
#   pip install pre-commit && pre-commit install
# Run on everything with: pre-commit run --all-files
# CI runs the full gate (mypy, Bandit, tests, docs) on every pull request.

exclude: ^graphify-out/  # generated knowledge-graph artifacts

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]  # syntax only: mkdocs.yml uses custom tags
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4  # keep in step with the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
