site_name: LLM-as-Judge
site_description: Open-source, free-tier LLM evaluation platform - pairwise, pointwise, reference, ranking, RAG and agent evaluation with bias safeguards.
site_url: https://syed-waleed-ahmed.github.io/LLM-as-Judge/
repo_url: https://github.com/syed-waleed-ahmed/LLM-as-Judge
repo_name: syed-waleed-ahmed/LLM-as-Judge
copyright: Copyright &copy; Syed Waleed Ahmed. MIT licensed.

# Rewrites repository-relative links (DEPLOYMENT.md, .env.example, ...) so they work
# on the site, and fails the strict build on links to files that don't exist.
hooks:
  - scripts/docs_links.py

theme:
  name: material
  custom_dir: overrides  # Open Graph and Twitter card tags for link previews
  icon:
    logo: material/scale-balance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search
  # Downloads Google Fonts and other external assets at build time and serves
  # them from the site: faster first load, and no third-party requests. Enabled
  # in CI only (GitHub sets CI=true), because it needs symlinks, which Windows
  # restricts by default.
  - privacy:
      enabled: !ENV [CI, false]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/syed-waleed-ahmed/LLM-as-Judge
      name: LLM-as-Judge on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Pages include repository files (README sections, ARCHITECTURE.md, ...) as the single
# source of truth. MkDocs can't resolve their repository-relative links, so it reports
# them at info level; scripts/docs_links.py then rewrites them and warns (failing the
# strict build) about any that point at a missing file.
validation:
  links:
    not_found: info
    anchors: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Reliability safeguards: guide/safeguards.md
      - RAG, agents and reliability: guide/rag-agents-reliability.md
      - Datasets, benchmarks and experiments: guide/datasets-experiments.md
      - Providers: guide/providers.md
      - Configuration: guide/configuration.md
  - Reference:
      - API reference: project/api-reference.md
      - Architecture: project/architecture.md
  - Project:
      - Deployment: project/deployment.md
      - Security: project/security.md
      - Benchmarks: project/benchmarks.md
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
      - Phase 0 audit: design/phase-0-audit.md
      - Delivery report: design/delivery-report.md
