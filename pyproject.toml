[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-as-judge-platform"
dynamic = ["version"]
description = "Open-source LLM-as-a-Judge evaluation platform: pairwise, pointwise, reference, ranking, RAG and agent evaluation with bias mitigation, as a Python library, CLI, REST API and Streamlit dashboard. Runs on free tiers or offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Waleed Ahmed", email = "syedwaleedahmed9@gmail.com" }]
keywords = [
    "llm",
    "llm-as-judge",
    "llm-evaluation",
    "evaluation",
    "rag-evaluation",
    "agent-evaluation",
    "benchmarking",
    "groq",
    "ollama",
    "nlp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "groq>=0.11.0",
    "httpx>=0.25.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "plotly>=5.20", "pandas>=1.4"]
yaml = ["pyyaml>=6.0"]
# PostgreSQL / Supabase experiment store (JUDGE_DB_PATH=postgresql://...).
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# MkDocs 2.0 drops the plugin/theme system Material relies on, so stay on 1.x.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
all = ["llm-as-judge-platform[ui,api,yaml,postgres]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "bandit[toml]>=1.7",
    "pre-commit>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff>=0.17,<0.18",  # pinned: formatter output differs between minor versions
    "mypy>=2.4,<2.5",  # pinned: inference (and so unused-ignore checks) varies by version
]

[project.scripts]
llm-judge = "llm_judge.cli:main"

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/LLM-as-Judge"
Documentation = "https://syed-waleed-ahmed.github.io/LLM-as-Judge/"
Demo = "https://llm-as-judge.streamlit.app/"
Repository = "https://github.com/syed-waleed-ahmed/LLM-as-Judge"
Issues = "https://github.com/syed-waleed-ahmed/LLM-as-Judge/issues"
Changelog = "https://github.com/syed-waleed-ahmed/LLM-as-Judge/blob/main/CHANGELOG.md"
Releases = "https://github.com/syed-waleed-ahmed/LLM-as-Judge/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_judge*"]

[tool.setuptools.dynamic]
version = { attr = "llm_judge.__version__" }

[tool.setuptools.package-data]
llm_judge = ["py.typed", "datasets/samples/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.bandit]
# Reviewed and suppressed with reasons (see SECURITY.md):
# B101 assert: internal invariants and type narrowing, not security checks.
# B311 random: seeded PRNG for reproducible sampling and bootstrap resampling.
# B615 HF download: false positive; llm_judge.datasets.load_dataset reads local files only.
skips = ["B101", "B311", "B615"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/llm_judge", "app.py", "dashboard"]
warn_unused_ignores = true
ignore_missing_imports = true
